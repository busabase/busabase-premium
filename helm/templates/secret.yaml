{{- if not .Values.secrets.existingSecret }}
{{/*
Generated once, then preserved — AND created before the migrate Job runs.

Both properties come from making this a hook, not a normal chart resource:

  - Ordering: Helm creates a chart's normal resources only AFTER pre-install
    hooks finish. The migrate Job is a pre-install hook (see migrate-job.yaml);
    a plain Secret would not exist yet when it runs. Found by actually
    installing the chart — "secret ... not found" — not by rendering the
    templates, which never checks creation order between hooks and resources.
    The weight here (-20) puts it before the bundled Postgres StatefulSet's (-15) and the migrate Job's (-5).
  - Idempotency: `lookup` reads back the Secret from a previous release and
    reuses its values on upgrade. Without it, every `helm upgrade` would mint
    new secrets — a new BETTER_AUTH_SECRET signs every user out, and a new
    Postgres password locks the app out of the database it is holding. Both
    are silent until someone tries to use the instance.
*/}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "busabase.secretName" .)) }}
{{- $prev := (and $existing $existing.data) | default dict }}
{{- $pgPassword := .Values.secrets.postgresPassword | default (index $prev "POSTGRES_PASSWORD" | default "" | b64dec) | default (randAlphaNum 32) }}
{{- $s3Secret := .Values.secrets.s3SecretKey | default (index $prev "S3_SECRET_KEY" | default "" | b64dec) | default (randAlphaNum 32) }}
{{- $authSecret := .Values.secrets.betterAuthSecret | default (index $prev "BETTER_AUTH_SECRET" | default "" | b64dec) | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "busabase.secretName" . }}
  labels:
    {{- include "busabase.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ $s3Secret | quote }}
  BETTER_AUTH_SECRET: {{ $authSecret | quote }}
{{- end }}
